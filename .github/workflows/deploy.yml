name: Build & Deploy to Kinghost

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.d7pharmabrazil.com.br
          username: d7pharmabrazil
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /www/
          local-dir: ./dist/
          exclude: |
            **/.git*
            **/.git*/**
