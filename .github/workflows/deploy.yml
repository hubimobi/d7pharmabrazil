name: Build & Deploy to Kinghost

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          # IMPORTANTE: nao use o hostname proxied pela Cloudflare (ex.:
          # ftp.d7pharmabrazil.com.br), pois a Cloudflare nao faz proxy de FTP
          # (porta 21) e a conexao expira (ETIMEDOUT). Aponte FTP_SERVER para o
          # host/IP direto do Kinghost OU crie um registro DNS "ftp" como
          # "DNS only" (nuvem cinza) na Cloudflare apontando para o IP de origem.
          server: ${{ secrets.FTP_SERVER || 'ftp.d7pharmabrazil.com.br' }}
          username: ${{ secrets.FTP_USERNAME || 'd7pharmabrazil' }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          timeout: 60000
          # Document root do dominio no Kinghost. Se o site nao aparecer apos o
          # deploy, o diretorio provavelmente e outro (ex.: /public_html/ ou
          # /www/d7pharmabrazil.com.br/). Defina o secret FTP_SERVER_DIR para
          # ajustar sem editar este arquivo.
          server-dir: ${{ secrets.FTP_SERVER_DIR || '/www/' }}
          local-dir: ./dist/
          exclude: |
            **/.git*
            **/.git*/**
